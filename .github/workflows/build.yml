name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure signing keystore (以后升级用同一个签名)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p signing
          if [ -f signing/cuotiben.jks ]; then
            echo "keystore 已在仓库里，直接用"
          else
            keytool -genkeypair -keystore signing/cuotiben.jks -alias cuotiben \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cuotiben2026 -keypass cuotiben2026 \
              -dname "CN=XiongHaoxuan, OU=xhx, O=xhx, L=SZ, S=GD, C=CN"
            git config user.email "ci@github.com"
            git config user.name "CI Bot"
            git add -f signing/cuotiben.jks
            git commit -m "Add signing keystore" || echo "nothing to commit"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:signing --force
            echo "keystore 已生成并存进 signing 分支"
          fi

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --no-daemon --stacktrace
          cache-disabled: true

      - name: Deliver APK via branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add -f app-debug.apk
          git commit -m "Deliver app-debug.apk" || echo "nothing to commit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:apk --force
