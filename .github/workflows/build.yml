name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # 关键：keystore 存在 signing 分支上，每次构建前先把它拉下来复用。
      # 只有这样「每次升级都是同一个签名」，手机上才能直接覆盖安装（不用卸载重装）。
      - name: 准备固定签名 keystore（以后升级用同一个签名）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p signing
          # 能拿到仓库里已存好的 keystore 就直接用（这样签名永远不变）
          if git fetch --depth=1 origin signing && \
             git cat-file -e origin/signing:signing/cuotiben.jks 2>/dev/null; then
            git show origin/signing:signing/cuotiben.jks > signing/cuotiben.jks
            echo "keystore 已存在，直接复用（签名不变）"
          else
            # 只在第一次构建时执行：生成一个 keystore 并存档到 signing 分支
            keytool -genkeypair -keystore signing/cuotiben.jks -alias cuotiben \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cuotiben2026 -keypass cuotiben2026 \
              -dname "CN=XiongHaoxuan, OU=xhx, O=xhx, L=SZ, S=GD, C=CN"
            git config user.email "ci@github.com"
            git config user.name "CI Bot"
            git add -f signing/cuotiben.jks
            git commit -m "Add signing keystore" || echo "nothing to commit"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:signing --force
            echo "keystore 首次生成，已存进 signing 分支"
          fi
          ls -l signing/cuotiben.jks
          # 把 key 的指纹打进日志：以后比对日志就能确认是不是同一个签名
          keytool -list -v -keystore signing/cuotiben.jks -storepass cuotiben2026 2>/dev/null \
            | grep -E "Alias name|Owner|SHA256" || true

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --no-daemon --stacktrace
          cache-disabled: true

      # 校验签名：把 APK 里的签名证书打进日志，和 keystore 指纹比对即可确认每次升级都是同一个签名
      - name: 校验 APK 签名
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs -v \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Deliver APK via branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add -f app-debug.apk
          git commit -m "Deliver app-debug.apk" || echo "nothing to commit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:apk --force
